[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-app-guard"
version = "0.1.0"
description = "Attack, fix and measure LLM apps: a red-team harness, an MCP guard server, and a vulnerable/guarded demo shop."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "agentic-core @ git+https://github.com/palaksharma020/agentic-core@v0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
demo = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
mcp = ["mcp>=2.3,<3"]
advisor = ["transformers>=5", "torch"]
render = ["playwright>=1.48"]

[project.scripts]
breakit = "breakit.cli:main"
guard = "guard_mcp.cli:main"
llm-app-guard = "guard_mcp.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["breakit", "guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests", "guard_mcp/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001", "RUF002", "RUF003", "SIM300"]
"patches/**" = ["RUF001", "RUF002", "RUF003", "SIM300", "I001"]
"eval/**" = ["RUF001"]
